<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle court silhouette in the bottom-right corner -->
  <g opacity="0.08" stroke="#22c55e" stroke-width="3" fill="none">
    <!-- Half-court outline -->
    <rect x="780" y="380" width="380" height="220" rx="2"/>
    <!-- Paint / key -->
    <rect x="900" y="380" width="140" height="120"/>
    <!-- Free throw circle -->
    <circle cx="970" cy="500" r="60"/>
    <!-- Three-point arc (approx) -->
    <path d="M 820 380 Q 970 600 1120 380"/>
  </g>

  <!-- Wordmark — same stacked style as the in-app Logo -->
  <g font-family="'Anton', 'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" text-anchor="middle">
    <text x="600" y="270" font-size="160" fill="#f97316" letter-spacing="3">BASKETBALL</text>
    <text x="600" y="365" font-size="82" letter-spacing="22" fill="#ffffff">TACTIC BOARD</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="475" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
        font-size="32" fill="#94a3b8" text-anchor="middle" font-weight="500">
    Design, animate, and share basketball plays
  </text>

  <!-- URL pill -->
  <g transform="translate(600 540)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="8" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif"
          font-size="20" fill="#f97316" text-anchor="middle" font-weight="600">
      basketballtacticboard.com
    </text>
  </g>
</svg>
